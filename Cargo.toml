[workspace]
resolver = "3"
members = ["crates/engine", "crates/engine-hw", "crates/app", "crates/mcp"]
# A plain `cargo build` / `cargo run` builds `engine-hw` too, so `hw-child` lands
# beside `target/<profile>/edith` and the hardware decode works. `-p edith` does
# not build it (artifact deps are nightly-only); `hwproc` warns once when a GPU is
# present and the child is missing.
default-members = ["crates/engine", "crates/engine-hw", "crates/app", "crates/mcp"]
# Vendored third-party (see [patch.crates-io]); not ours to build or test.
exclude = [
    "tools/edith-stt",
    "vendor/cros-libva",
    "vendor/cros-codecs",

    "vendor/mp4",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Panics and backtraces keep file:line; full variable debug info is dropped, which
# shrinks the target dir and the link time of every test binary. For a debugger
# session, build with CARGO_PROFILE_DEV_DEBUG=2. The test profile inherits this.
[profile.dev]
debug = "line-tables-only"

# Vendored third-party crate, patched for one clearly marked fix (see below).
[patch.crates-io]
# Drops the `pub use proc_macro;` re-export (E0365 future-incompat, rustc
# warns on every workspace build); nothing in the crate or its users names it.
proc-macro-error2 = { path = "vendor/proc-macro-error2" }
# gpui 0.2.2 (Apache-2.0, LICENSE-APACHE kept in the copy) with one fix: its
# wl_keyboard Modifiers and Key handlers unwrap the keymap, which is None until
# the Keymap event arrives, so an early event panicked at startup. Those handlers
# now return early instead. A second fix: Wayland ignored `WindowOptions::display_id`,
# so a window that names a display goes fullscreen on that output (the video output
# window's "Output display"). Both are in third_party/gpui/src/platform/linux/wayland/client.rs.
gpui = { path = "third_party/gpui" }
