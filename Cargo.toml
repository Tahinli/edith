[workspace]
resolver = "3"
members = ["crates/engine", "crates/engine-hw", "crates/engine-audio", "crates/app"]
# Vendored third-party (see [patch.crates-io]); not ours to build or test.
exclude = [
    "vendor/cros-libva",
    "vendor/cros-codecs",
    "vendor/rusty_aac",
    "vendor/oxideav-h265",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Four upstream crates vendored verbatim except for one clearly marked fix each,
# all blockers on this machine and all still unfixed upstream as of
# 0.0.6/0.0.13/0.5.0/0.0.9:
#   cros-libva  - fails to build against libva >= 1.23 headers
#   cros-codecs - probes VA-API with a 16x16 context that Mesa radeonsi refuses;
#                 and creates every decode context as 8-bit 4:2:0, which no HEVC
#                 Main 10 stream can decode into (its own TODO, its own answer)
#   rusty_aac   - its *decoder* runs the direct O(N²) IMDCT with a `cos` call per
#                 term (the fast path in the same file serves the encoder only),
#                 which is 4x slower than real time for 5.1 and therefore not
#                 playable at all; the patch routes the IMDCT through the same
#                 N/4-point FFT the encoder's MDCT already uses (`dsp::dct4`),
#                 40x the matrix version it started as -- 2 hours of 5.1 for a
#                 waveform in 2.4 minutes rather than an hour
#   oxideav-h265 - its intra encoder writes `conformance_window_flag = 0` and
#                 refuses any dimension that is not a multiple of the 16-sample
#                 CTB, so 1920x1080 could not be written at all; the patch adds
#                 the §7.4.3.2.1 conformance window (`SpsCfg::conf_win`, one
#                 marked block in `encoder/intra.rs`) so the picture is coded
#                 padded to 1920x1088 and *displayed* at 1920x1080. Taken from
#                 git master rather than the registry -- crates.io 0.0.9 is the
#                 pre-encoder release -- at rev d35963a02c872d12e6878b4ed3cf17a
#                 69bde5a6e, and it is a plain path dependency (no
#                 `[patch.crates-io]` line) because nothing else in the tree
#                 asks for it.
# Drop `vendor/` entirely once released versions handle all four.
[patch.crates-io]
cros-libva = { path = "vendor/cros-libva" }
cros-codecs = { path = "vendor/cros-codecs" }
rusty_aac = { path = "vendor/rusty_aac" }
