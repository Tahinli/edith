[package]
name = "engine-hw"
version.workspace = true
edition.workspace = true

# The hardware child. This package is the one allowed to link libva/drm, and
# it is never linked into the editor: `hw-child` is a binary the editor spawns
# next to its own executable, and the editor keeps working without it.
[lib]
name = "engine_hw"
# No runnable doc examples; skip the rustdoc test pass.
doctest = false

[[bin]]
name = "hw-child"
path = "src/bin/hw-child.rs"

[dependencies]
engine = { path = "../engine" }
# The decode seat: ec-hw drives the VA-API decoders, ec-va the display under it.
ec-hw = { path = "../../../edith_codecs/crates/ec-hw" }
ec-va = { path = "../../../edith_codecs/crates/ec-va" }
# The software VP8 seat, this project's own (`ec-vp8`, RFC 6386).
ec-vp8 = { path = "../../../edith_codecs/crates/ec-vp8" }
