[package]
name = "engine-hw"
version.workspace = true
edition.workspace = true

# cdylib only: this is the one artifact allowed to link libva/gbm/drm. The app
# dlopens it and keeps working when it is missing.
[lib]
name = "engine_hw"
crate-type = ["cdylib"]

[dependencies]
engine = { path = "../engine" }
cros-codecs = { version = "0.0.6", features = ["vaapi"] }
# Same version cros-codecs already pulls in; we allocate output frames ourselves.
gbm = { version = "0.15", default-features = false, features = ["drm-support"] }
# The software VP8 seat, this project's own (`ec-vp8`, RFC 6386): linked in
# as ordinary Rust, the one codec with no runtime dlopen behind it -- the
# `libloading` the old libvpx FFI needed is gone with the FFI.
ec-vp8 = { path = "../../../edith_codecs/crates/ec-vp8" }
