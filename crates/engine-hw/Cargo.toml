[package]
name = "engine-hw"
version.workspace = true
edition.workspace = true

# cdylib only: this is the one artifact allowed to link libva/gbm/drm. The app
# dlopens it and keeps working when it is missing.
[lib]
name = "engine_hw"
crate-type = ["cdylib"]

[dependencies]
engine = { path = "../engine" }
cros-codecs = { version = "0.0.6", features = ["vaapi"] }
# Same version cros-codecs already pulls in; we allocate output frames ourselves.
gbm = { version = "0.15", default-features = false, features = ["drm-support"] }
# Same version `engine` pins for its own dlopens (`hw.rs`, `ao.rs`); this is
# the plugin's half of the same philosophy, one level down: `libvpx` for the
# software VP8 seat (`src/vpx.rs`), resolved at runtime like libva itself.
libloading = "0.8"
